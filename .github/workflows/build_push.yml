name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            gofiles:
              - 'go/**'


      - name: Set up Go
        if: steps.filter.outputs.gofiles == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Android SDK
        if: steps.filter.outputs.gofiles == 'true'
        uses: android-actions/setup-android@v2
        with:
          sdk-version: '30'

      - name: Install Android NDK
        if: steps.filter.outputs.gofiles == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Commit build library
        if: steps.filter.outputs.gofiles == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/libs/server.aar
          git add app/libs/server-sources.jar
          git commit -m "Add compiled torrserver library"

      - name: Push changes
        if: steps.filter.outputs.gofiles == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: akidev


      - uses: dorny/paths-filter@v2
        id: gofiles-filter
        with:
          filters: |
            gofiles:
              - 'go/**'


      - name: Set up Go
        if: steps.gofiles-filter.outputs.gofiles == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Android SDK
        if: steps.gofiles-filter.outputs.gofiles == 'true'
        uses: android-actions/setup-android@v2
        with:
          sdk-version: '30'

      - name: Install Android NDK
        if: steps.gofiles-filter.outputs.gofiles == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Commit build library
        if: steps.gofiles-filter.outputs.gofiles == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/libs/server.aar
          git add app/libs/server-sources.jar
          git commit -m "Add compiled torrserver library"

      - name: Push changes
        if: steps.gofiles-filter.outputs.gofiles == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: akidev


      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      # Official Animetail stores Google Drive OAuth JSON in this secret.
      # Forks usually do not have it; skip so CI can still build.
      # secrets cannot be used in `if:` — check the env var in the script instead.
      - name: Write client_secrets.json
        env:
          CLIENT_SECRETS_TEXT: ${{ secrets.CLIENT_SECRETS_TEXT }}
        run: |
          if [ -n "$CLIENT_SECRETS_TEXT" ]; then
            mkdir -p app/src/main/assets
            printf '%s' "$CLIENT_SECRETS_TEXT" > app/src/main/assets/client_secrets.json
          else
            echo "CLIENT_SECRETS_TEXT is not set; skipping Google Drive client secrets"
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: animetail-debug-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: animetail-release-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Check code format
        continue-on-error: true
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        continue-on-error: true
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload mapping
        if: hashFiles('app/build/outputs/mapping/release/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Sign APK and create release for tags

      - name: Get tag name

        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Animetailapp/Animetail'
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Animetailapp/Animetail'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Animetailapp/Animetail'
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk animetail-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum animetail-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk animetail-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum animetail-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk animetail-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum animetail-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk animetail-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum animetail-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk animetail-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum animetail-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Animetailapp/Animetail'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Animetail ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }}
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            animetail-${{ env.VERSION_TAG }}.apk
            animetail-arm64-v8a-${{ env.VERSION_TAG }}.apk
            animetail-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            animetail-x86-${{ env.VERSION_TAG }}.apk
            animetail-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

